<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Babii Oleksandr — Full-stack Web Developer (Vue, Nuxt, TypeScript, Node.js). Interactive resume and portfolio in English, Ukrainian and Russian."
    />
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Babii Oleksandr | Full-stack Web Developer" />
    <meta
      property="og:description"
      content="An interactive resume and portfolio set in a 3D disco room: experience, projects, skills and a PDF resume."
    />
    <title>Babii Oleksandr | Full-stack Web Developer</title>
    <!-- Styled inline: the overlay has to paint before any bundle or main.css loads. -->
    <style>
      .loading-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
        color: #f5f7fb;
      }

      .loading-screen__glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 44%, rgba(125, 227, 255, 0.13), transparent 34%),
          radial-gradient(circle at 50% 44%, rgba(43, 88, 164, 0.3), transparent 60%),
          radial-gradient(circle at 50% 44%, #0d1730 0%, #080b1a 52%, #05060d 100%);
      }

      .loading-screen__disc {
        position: relative;
        width: clamp(96px, 22vw, 128px);
        aspect-ratio: 1;
        color: #eaf6ff;
      }

      .loading-screen__spin {
        display: block;
        width: 100%;
        height: 100%;
        animation: loading-screen-spin 1.9s linear infinite;
      }

      .loading-screen__spin svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      @keyframes loading-screen-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loading-screen__percent {
        position: relative;
        margin: 0;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        font-size: clamp(26px, 5vw, 34px);
        font-weight: 500;
        line-height: 1;
        letter-spacing: 0.06em;
        font-variant-numeric: tabular-nums;
      }

      .loading-screen__percent span:last-child {
        margin-left: 0.15em;
        font-size: 0.62em;
        color: #7d879c;
      }

      .loading-screen.is-leaving {
        pointer-events: none;
      }

      .loading-screen.is-leaving .loading-screen__percent {
        opacity: 0;
        transition: opacity 180ms ease;
      }

      .loading-screen.is-leaving .loading-screen__disc {
        opacity: 0;
        transform: translate(var(--loading-exit-x, 0px), var(--loading-exit-y, -34vh))
          scale(var(--loading-exit-scale, 1.8));
        transition:
          transform 900ms cubic-bezier(0.22, 1, 0.36, 1),
          opacity 620ms ease-in 280ms;
      }

      .loading-screen.is-leaving .loading-screen__glow {
        opacity: 0;
        transition: opacity 560ms ease 140ms;
      }

      .loading-screen.is-instant .loading-screen__spin {
        animation: none;
      }

      .loading-screen.is-instant.is-leaving .loading-screen__disc,
      .loading-screen.is-instant.is-leaving .loading-screen__glow,
      .loading-screen.is-instant.is-leaving .loading-screen__percent {
        transform: none;
        opacity: 0;
        transition: opacity 200ms ease;
      }

      @media (prefers-reduced-motion: reduce) {
        .loading-screen__spin {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div
      id="loading-screen"
      class="loading-screen"
      role="progressbar"
      aria-label="Loading"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
    >
      <div class="loading-screen__glow"></div>
      <div class="loading-screen__disc">
        <span class="loading-screen__spin">
          <!-- Inlined copy of src/assets/icons/compact-disc.svg (index.html cannot import assets). -->
          <svg viewBox="0 0 512 512" aria-hidden="true" focusable="false">
            <path
              fill="currentColor"
              d="M336.77 30.56A240 240 0 0 0 137.145 48 240 240 0 0 0 20.162 298.94l142.405-25.665c-6.87-38.47 10.598-78.89 46.42-99.323 25.063-14.296 53.977-15.877 79.228-6.808L336.77 30.56zm52.936 26.914-80.56 120.245c11.773 7.904 21.943 18.56 29.43 31.683 25.942 45.482 10.03 103.645-35.452 129.588-43.752 24.957-99.236 11.178-126.487-30.395L55.644 388a240 240 0 0 0 319.322 76.943 240 240 0 0 0 89.56-327.382 240 240 0 0 0-74.82-80.086zM290.19 187.387c-22.148-10.942-49.142-11-72.286 2.2-30.09 17.163-44.195 51.33-37.098 83.402a77.315 77.315 0 0 0 8.364 21.63c21.123 37.033 68.003 49.86 105.035 28.737s49.858-68.003 28.736-105.035c-7.92-13.887-19.463-24.37-32.75-30.935zm-15.607 33.635a40 40 0 0 1 16.218 15.632 40 40 0 0 1-14.927 54.563 40 40 0 0 1-54.56-14.927 40 40 0 0 1-4.31-11.153 40 40 0 0 1 19.232-43.41 40 40 0 0 1 38.348-.705zm-109.206 63.764L27.33 327.966a240 240 0 0 0 13.3 34.151L170.765 298.3a94.443 94.443 0 0 1-5.388-13.514z"
            />
          </svg>
        </span>
      </div>
      <p class="loading-screen__percent">
        <span class="loading-screen__percent-value">0</span><span>%</span>
      </p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
